version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - sistesis-net

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: sistesis_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init_sistesis.sql:/docker-entrypoint-initdb.d/init_sistesis.sql
    networks:
      - sistesis-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - sistesis-net

networks:
  sistesis-net:
    driver: bridge

volumes:
  db_data:
