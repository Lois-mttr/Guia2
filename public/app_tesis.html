<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SISTESIS-UNI - SPA de Tesis</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">Gestión de tesis</h1>
  <p id="mensaje" class="mb-4"></p>

  <form id="form-tesis" class="grid gap-3 mb-6">
    <input id="titulo" class="border p-2" placeholder="Título" required>
    <textarea id="descripcion" class="border p-2" placeholder="Descripción"></textarea>
    <input id="estudiante_id" class="border p-2" type="number" min="1" placeholder="ID del estudiante" required>
    <button class="bg-blue-500 text-white p-2" type="submit">Agregar tesis</button>
  </form>

  <table class="w-full border-collapse border">
    <thead><tr><th class="p-2 border">Título</th><th class="p-2 border">Estado</th><th class="p-2 border">Acciones</th></tr></thead>
    <tbody id="tabla-tesis"></tbody>
  </table>

  <script src="/public/js/tesis_client.js"></script>
</body>
</html>
